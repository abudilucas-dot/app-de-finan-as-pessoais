<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F766E" />
    <title>Valune — sem conexão</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1120;
        color: #f8fafc;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #0f766e;
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      p {
        margin: 12px 0 0;
        color: #cbd5e1;
        line-height: 1.55;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        padding: 0 18px;
        background: #14b8a6;
        color: #06121a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">V</div>
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet e tente novamente para acessar suas finanças atualizadas.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
